<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>study-note.md — 一份 SDD 學習筆記</title>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<style>
:root{
  --bg:#0b0f14;
  --bg-2:#111823;
  --panel:rgba(255,255,255,.035);
  --panel-2:rgba(255,255,255,.055);
  --line:rgba(255,255,255,.10);
  --line-2:rgba(255,255,255,.18);
  --fg:#e8edf4;
  --fg-dim:#9fb0c3;
  --fg-faint:#6b7d92;
  --accent:#f0b429;
  --accent-2:#ffd166;
  --green:#4ade80;
  --red:#f87171;
  --blue:#60a5fa;
  --paper:rgba(240,180,41,.055);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,ui-serif,serif;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,
         "PingFang TC","Heiti TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --cjk:"PingFang TC","Heiti TC","Noto Sans TC","Hiragino Sans CNS","Microsoft JhengHei",
        ui-sans-serif,-apple-system,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;overflow:hidden}
#root{height:100vh}

.deck{position:relative;height:100vh;width:100vw;overflow:hidden;
  background:
    radial-gradient(1200px 700px at 12% -10%, rgba(240,180,41,.10), transparent 60%),
    radial-gradient(900px 600px at 100% 110%, rgba(96,165,250,.09), transparent 60%),
    linear-gradient(180deg,var(--bg) 0%, var(--bg-2) 100%);
}
.deck::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.035;
  background-image:radial-gradient(rgba(255,255,255,.9) .5px, transparent .5px);background-size:3px 3px}

.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:74px 84px 104px}
.slide{width:100%;max-width:1120px;max-height:100%;overflow:auto;scrollbar-width:thin}
.slide::-webkit-scrollbar{width:6px}
.slide::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px}
.anim{animation:rise .46s cubic-bezier(.22,.9,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.anim{animation:none}}

.progress{position:absolute;top:0;left:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent-2));
  box-shadow:0 0 18px rgba(240,180,41,.55);transition:width .4s cubic-bezier(.22,.9,.3,1);z-index:20}
.topbar{position:absolute;top:26px;left:84px;right:84px;display:flex;justify-content:space-between;
  align-items:center;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-faint);z-index:15}
.topbar .brand{display:flex;align-items:center;gap:10px;font-family:var(--mono);text-transform:none;letter-spacing:.02em}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}

.nav{position:absolute;bottom:26px;right:84px;display:flex;align-items:center;gap:10px;z-index:15}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;
  border:1px solid var(--line-2);background:var(--panel);color:var(--fg);font-family:var(--sans);
  font-size:13px;font-weight:500;cursor:pointer;transition:background .18s,border-color .18s,transform .12s,opacity .18s}
.btn:hover:not(:disabled){background:var(--panel-2);border-color:var(--accent);color:var(--accent-2)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn svg{width:14px;height:14px}
.counter{font-family:var(--mono);font-size:12px;color:var(--fg-faint);letter-spacing:.08em;padding:0 12px;
  font-variant-numeric:tabular-nums}
.counter b{color:var(--fg);font-weight:600}
.rail{position:absolute;bottom:34px;left:84px;display:flex;gap:5px;z-index:15;max-width:50vw;flex-wrap:wrap}
.tick{width:16px;height:3px;border-radius:3px;background:var(--line);border:0;padding:0;cursor:pointer;
  transition:background .2s,transform .2s}
.tick:hover{background:var(--line-2);transform:scaleY(2)}
.tick.on{background:var(--accent);box-shadow:0 0 8px rgba(240,180,41,.6)}
.tick.done{background:rgba(240,180,41,.32)}

/* ---------- typography ---------- */
.kicker{display:inline-flex;align-items:center;gap:9px;font-size:11.5px;font-weight:600;letter-spacing:.18em;
  text-transform:uppercase;color:var(--accent);margin-bottom:20px;font-family:var(--mono)}
.kicker::before{content:"";width:22px;height:1px;background:var(--accent);opacity:.7}
h1.title{font-family:var(--serif);font-size:clamp(38px,5vw,68px);line-height:1.06;letter-spacing:-.02em;font-weight:400}
h1.title.cjk{font-family:var(--cjk);font-weight:300;letter-spacing:.01em;line-height:1.3;font-size:clamp(32px,4.2vw,56px)}
h2{font-family:var(--cjk);font-size:clamp(25px,3.1vw,40px);line-height:1.3;font-weight:400;letter-spacing:.005em}
h2 em{font-style:normal;color:var(--accent-2)}
h2.en{font-family:var(--serif);font-style:normal;letter-spacing:-.015em;line-height:1.14}
.sub{font-size:clamp(14.5px,1.45vw,17.5px);color:var(--fg-dim);line-height:1.72;max-width:72ch;margin-top:13px}
.rule{height:1px;background:linear-gradient(90deg,var(--line-2),transparent);margin:24px 0 26px}
strong{color:var(--fg);font-weight:600}
.hl{color:var(--accent-2);font-weight:600}
.mono{font-family:var(--mono);font-size:.88em;background:rgba(255,255,255,.06);padding:2px 6px;border-radius:5px;
  color:var(--accent-2);border:1px solid var(--line)}
p.body{font-size:16px;line-height:1.72;color:var(--fg-dim);max-width:74ch}
p.body + p.body{margin-top:12px}

/* ---------- the note card: the primary source ---------- */
.note{position:relative;border:1px solid rgba(240,180,41,.24);border-left:3px solid var(--accent);
  background:linear-gradient(135deg,var(--paper),rgba(240,180,41,.012));border-radius:0 14px 14px 0;
  padding:24px 30px 26px}
.note .src{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
  color:var(--accent);opacity:.9;margin-bottom:16px;flex-wrap:wrap}
.note .src .sep{opacity:.4}
.note .q{font-family:var(--cjk);font-size:clamp(16px,1.9vw,23px);line-height:1.95;color:var(--fg);
  letter-spacing:.015em;font-weight:300}
.note .q.small{font-size:clamp(14.5px,1.55vw,18px);line-height:1.9}
.note .q + .q{margin-top:16px}
.note .en{margin-top:18px;padding-top:16px;border-top:1px dashed rgba(240,180,41,.22);
  font-size:14.5px;line-height:1.7;color:var(--fg-dim);font-style:italic}
.note.big .q{font-size:clamp(20px,2.6vw,34px);line-height:1.8;font-weight:300}

/* ---------- reference chip: milestone evidence, visibly secondary ---------- */
.ref{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:16px 18px}
.ref .lbl{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--fg-faint);margin-bottom:9px}
.ref .lbl::before{content:"";width:5px;height:5px;border-radius:1px;background:var(--fg-faint);transform:rotate(45deg)}
.ref h4{font-size:14.5px;font-weight:600;margin-bottom:6px;line-height:1.35;color:var(--fg)}
.ref p{font-size:13.5px;line-height:1.62;color:var(--fg-dim)}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g21{grid-template-columns:1.35fr 1fr;align-items:start}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:19px 21px;
  transition:border-color .2s,background .2s}
.card:hover{border-color:var(--line-2);background:var(--panel-2)}
.card .n{font-family:var(--mono);font-size:10.5px;color:var(--accent);letter-spacing:.13em;margin-bottom:9px}
.card h3{font-size:15.5px;font-weight:600;margin-bottom:7px;line-height:1.35}
.card p{font-size:14px;line-height:1.62;color:var(--fg-dim)}

.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.stat .v{font-family:var(--serif);font-size:clamp(27px,3.2vw,40px);line-height:1;letter-spacing:-.02em;color:var(--accent-2)}
.stat .l{margin-top:10px;font-size:12px;color:var(--fg-faint);line-height:1.5}

ul.list{list-style:none;display:flex;flex-direction:column;gap:12px}
ul.list li{position:relative;padding-left:25px;font-size:15.5px;line-height:1.65;color:var(--fg-dim)}
ul.list li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:2px;
  background:var(--accent);transform:rotate(45deg);opacity:.85}

.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:2px 8px;border-radius:20px;
  border:1px solid var(--line-2);color:var(--fg-dim);white-space:nowrap}
.tag.red{color:var(--red);border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.08)}
.tag.green{color:var(--green);border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.08)}
.tag.amber{color:var(--accent);border-color:rgba(240,180,41,.35);background:rgba(240,180,41,.08)}

.callout{border:1px solid rgba(240,180,41,.26);background:linear-gradient(135deg,rgba(240,180,41,.09),rgba(240,180,41,.02));
  border-radius:14px;padding:19px 22px;font-size:15.5px;line-height:1.68;color:var(--fg)}
.callout .lbl{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--accent);margin-bottom:9px}

.flow{display:flex;align-items:stretch}
.flow .step{flex:1;border:1px solid var(--line);background:var(--panel);padding:17px}
.flow .step:first-child{border-radius:12px 0 0 12px}
.flow .step:last-child{border-radius:0 12px 12px 0}
.flow .step + .step{border-left:0}
.flow .step .ph{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--accent);margin-bottom:8px}
.flow .step h5{font-size:14.5px;font-weight:600;margin-bottom:6px}
.flow .step p{font-size:12.8px;color:var(--fg-dim);line-height:1.55}

.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:58vh}
.center .sub{margin-left:auto;margin-right:auto}
.footnote{margin-top:20px;font-size:12.5px;color:var(--fg-faint);line-height:1.65}

table{width:100%;border-collapse:collapse;font-size:14px}
thead th{text-align:left;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fg-faint);
  font-weight:600;padding:0 13px 10px;border-bottom:1px solid var(--line-2)}
tbody td{padding:12px 13px;border-bottom:1px solid var(--line);color:var(--fg-dim);line-height:1.5;vertical-align:top}
tbody tr:last-child td{border-bottom:0}
td.k{color:var(--fg);font-weight:600;white-space:nowrap}

@media (max-width:1100px){
  .stage{padding:64px 40px 100px}
  .topbar{left:40px;right:40px}
  .nav{right:40px}
  .rail{left:40px}
  .g2,.g3,.g21{grid-template-columns:1fr}
  .flow{flex-direction:column}
  .flow .step{border-left:1px solid var(--line)!important}
  .flow .step:first-child{border-radius:12px 12px 0 0}
  .flow .step:last-child{border-radius:0 0 12px 12px}
  .flow .step + .step{border-top:0}
}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;

/* ---------------- primitives ---------------- */
const Kicker = ({children}) => <div className="kicker">{children}</div>;
const Rule = () => <div className="rule" />;

const Head = ({kicker, title, sub, en}) => (
  <>
    {kicker && <Kicker>{kicker}</Kicker>}
    <h2 className={en ? "en" : ""} dangerouslySetInnerHTML={{__html:title}} />
    {sub && <p className="sub">{sub}</p>}
    <Rule />
  </>
);

/* The note card — study-note.md quoted verbatim. The spine of the deck. */
const Note = ({path, lines, en, big, small}) => (
  <div className={"note" + (big ? " big" : "")}>
    <div className="src">
      <span>study-note.md</span>
      {path.map((p,i) => <React.Fragment key={i}><span className="sep">›</span><span>{p}</span></React.Fragment>)}
    </div>
    {lines.map((l,i) => <p key={i} className={"q" + (small ? " small" : "")}>{l}</p>)}
    {en && <div className="en">{en}</div>}
  </div>
);

/* Milestone evidence — deliberately quieter than the note. */
const Ref = ({from, h, children}) => (
  <div className="ref">
    <div className="lbl">{from}</div>
    {h && <h4>{h}</h4>}
    <p>{children}</p>
  </div>
);

const Card = ({n, h, children}) => (
  <div className="card">{n && <div className="n">{n}</div>}<h3>{h}</h3><p>{children}</p></div>
);
const Stat = ({v, l}) => <div className="stat"><div className="v">{v}</div><div className="l">{l}</div></div>;
const Table = ({cols, rows}) => (
  <table>
    <thead><tr>{cols.map((c,i)=><th key={i}>{c}</th>)}</tr></thead>
    <tbody>{rows.map((r,i)=><tr key={i}>{r.map((c,j)=><td key={j} className={j===0?"k":""}>{c}</td>)}</tr>)}</tbody>
  </table>
);

/* ================================ slides ================================ */
const SLIDES = [

/* 1 */
{ id:"cover", label:"封面", node:(
  <div className="center">
    <Kicker>study-note.md · 2026-08-08 → 08-12</Kicker>
    <h1 className="title cjk">從做中學 SDD<br/><span style={{color:"var(--accent-2)"}}>一份學習筆記</span></h1>
    <p className="sub" style={{maxWidth:"56ch",marginTop:24}}>
      這份簡報以 <span className="mono">study-note.md</span> 為主軸 —— 作者自己寫的學習日誌，
      逐字引用、依原本的順序展開。三份 milestone 交付文件只作為佐證。
    </p>
    <div style={{marginTop:34,display:"flex",gap:10,flexWrap:"wrap",justifyContent:"center"}}>
      <span className="tag amber">OpenSpec</span>
      <span className="tag">Claude Code</span>
      <span className="tag">Doris / MySQL proxy</span>
      <span className="tag green">3 milestones</span>
    </div>
  </div>
)},

/* 2 */
{ id:"howto", label:"怎麼讀", node:(
  <>
    <Head
      kicker="這份簡報的讀法"
      title="筆記是主角，交付文件是註腳"
      sub="每一頁的主體都是 study-note.md 的原文。灰色的小卡片才是 milestone 文件裡的數字與細節，用來對照作者當下的判斷後來成不成立。"
    />
    <div className="grid g2">
      <Note
        path={["# constitution"]}
        lines={["This file can only modify by human manual without AI agent. Basicly, ai agent should just ignore this file and the content of this file."]}
        en="筆記的第一行就是一條規則：這個檔案只由人手動修改。它是整個 repo 裡唯一不被 agent 碰的文件 —— 也因此是唯一沒有被事後整理過的第一手紀錄。"
      />
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        <Ref from="對照組" h="milestones/*.md 是事後寫的">
          三份 milestone retrospective 都是收尾時整理的，經過歸納、驗證、加上數字。
          筆記則是<strong>當下</strong>寫的 —— 包含還沒被驗證的猜想，以及後來證明說對了的直覺。
        </Ref>
        <div className="callout">
          <span className="lbl">為什麼這樣安排</span>
          這份筆記最有價值的地方，不是它記了什麼結論，而是它記了<strong>作者在還不知道結論時怎麼想</strong>。
          milestone 文件會告訴你答案；筆記會告訴你答案是怎麼長出來的。
        </div>
      </div>
    </div>
  </>
)},

/* 3 */
{ id:"m1-lost", label:"M1 · 迷失", node:(
  <>
    <Head kicker="milestone 1" title="起點：想選工具，結果<em>迷失方向</em>" />
    <Note
      path={["# milestone-1"]}
      lines={["讓 claude code 做前期研究，幫我規劃案例選擇 SDD 要用 openspec 還是 speckit．結果在討論案例內容時複雜到讓我迷失方向．所以我另外花時間直接讀了一下 openspec 的用法，然後決定直接開始用 openspec 從做中學習．"]}
    />
    <div className="grid g3" style={{marginTop:22}}>
      <Card n="決策" h="不靠研究決定，直接開始用">
        「從做中學習」這個決定，後來變成整個專案的方法論。
      </Card>
      <Card n="關鍵動作" h="自己去讀 openspec 的用法">
        不是等 AI 給結論，而是自己回到一手資料。這個動作在 milestone 2 又重複了一次。
      </Card>
      <Ref from="milestone-1.md 的說法" h="同一件事，事後的措辭">
        「No tool chosen — <strong>deliberately</strong>. The decision moves to hands-on use.」
        文件把它寫成一個深思熟慮的決定；筆記顯示它其實是<strong>被複雜度逼出來的</strong>。
      </Ref>
    </div>
  </>
)},

/* 4 */
{ id:"m1-branch", label:"M1 · 太多分支", node:(
  <>
    <Head kicker="milestone 1 · 當下的假設" title="真正的痛點被說出來了" />
    <Note
      big
      path={["# milestone-1"]}
      lines={["目前的感想是工作階段可能會有太多分支，以至於靠人力無法快速收斂，最後迷失在各個問題中，忘了原本的目標．目前認為 openspec 的設計概念可能可以解決這個問題．"]}
    />
    <div className="grid g2" style={{marginTop:22}}>
      <div className="callout">
        <span className="lbl">這句話為什麼重要</span>
        它是整份筆記裡唯一一次<strong>正面說出「我想解決什麼」</strong>。
        不是「spec 比較嚴謹」，也不是「文件比較完整」，而是 ——
        <span className="hl">分支太多、收斂不了、忘記原本的目標。</span>
      </div>
      <Ref from="milestone-1.md §1" h="但研究文件記錄的是相反的事">
        當時登記在案的風險是「<strong>R4 — 沒有實際痛點，純屬主動採用</strong>」，
        並被標記為最大的失敗風險（沒有痛點的流程，通常在第三週被放棄）。
        <br/><br/>
        筆記顯示痛點其實存在，只是<strong>沒有被寫進需求訪談裡</strong>。
      </Ref>
    </div>
  </>
)},

/* 5 — the headline */
{ id:"guess", label:"AI 就靠猜", node:(
  <div className="center">
    <Kicker>study-note.md · milestone-1 · 唯一有標題的一節</Kicker>
    <h1 className="title cjk" style={{maxWidth:"20ch",lineHeight:1.35}}>
      你不知道的，<br/>沒講清楚的，<br/><span style={{color:"var(--accent-2)"}}>AI 就靠猜．</span>
    </h1>
    <p className="sub" style={{maxWidth:"52ch",marginTop:28}}>
      這是筆記裡唯一一個被作者下了標題的段落 —— 也就是唯一一件他認為值得單獨命名的事。
      底下記了兩個例子，兩個都讓他付出了時間。
    </p>
  </div>
)},

/* 6 */
{ id:"guess-1", label:"猜 · 例一", node:(
  <>
    <Head kicker="第一個例子" title="沒說清楚要哪一層，就拿到了<em>不在意的那一層</em>" />

      這份筆記總共 49 行。它沒有數字、沒有表格、沒有結論 ——
      但 milestone 3 之所以能收尾，靠的是裡面那句用「猜想」開頭的自我診斷。
    </p>
    <p className="sub" style={{maxWidth:"58ch",marginTop:14}}>
      <strong>寫下當下的假設，比寫下事後的結論更有用。</strong>
    </p>
    <div style={{marginTop:38,display:"flex",gap:24,flexWrap:"wrap",justifyContent:"center",
      fontSize:12,color:"var(--fg-faint)",fontFamily:"var(--mono)"}}>
      <span>study-note.md</span>
      <span>milestones/milestone-1..3.md</span>
      <span>milestones/project3/</span>
    </div>
  </div>
)},

];

/* ================================ deck ================================ */
function Deck(){
  const [i, setI] = useState(0);
  const n = SLIDES.length;
  const go = useCallback((d) => setI(p => Math.min(n-1, Math.max(0, p + d))), [n]);

  useEffect(() => {
    const onKey = (e) => {
      if (["ArrowRight","PageDown"," ","Enter"].includes(e.key)) { e.preventDefault(); go(1); }
      else if (["ArrowLeft","PageUp","Backspace"].includes(e.key)) { e.preventDefault(); go(-1); }
      else if (e.key === "Home") setI(0);
      else if (e.key === "End") setI(n-1);
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [go, n]);

  const s = SLIDES[i];

  return (
    <div className="deck">
      <div className="progress" style={{width:`${((i+1)/n)*100}%`}} />
      <div className="topbar">
        <div className="brand"><span className="dot" /> study-note.md</div>
        <div>{s.label}</div>
      </div>

      <div className="stage">
        <div className="slide anim" key={s.id}>{s.node}</div>
      </div>

      <div className="rail">
        {SLIDES.map((sl,k)=>(
          <button key={sl.id}
            className={"tick" + (k===i?" on":k<i?" done":"")}
            onClick={()=>setI(k)}
            title={`${k+1}. ${sl.label}`}
            aria-label={`前往第 ${k+1} 頁：${sl.label}`} />
        ))}
      </div>

      <div className="nav">
        <button className="btn" onClick={()=>go(-1)} disabled={i===0} aria-label="上一頁">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          上一頁
        </button>
        <span className="counter"><b>{String(i+1).padStart(2,"0")}</b> / {String(n).padStart(2,"0")}</span>
        <button className="btn" onClick={()=>go(1)} disabled={i===n-1} aria-label="下一頁">
          下一頁
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Deck />);
</script>
</body>
</html>
