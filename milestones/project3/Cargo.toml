[package]
name = "mysql-proxy"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A MySQL wire-protocol proxy that logs every statement passing through it"
publish = false

[lib]
name = "mysql_proxy"
path = "src/lib.rs"

[[bin]]
name = "mysql-proxy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = [
    "net",
    "fs",
    "io-util",
    "sync",
    "signal",
    "macros",
    "rt-multi-thread",
    "time",
] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = 1
