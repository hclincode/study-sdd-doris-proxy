services:
  mysql:
    image: mysql:8.0
    container_name: mysql-proxy-test-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: shop
      MYSQL_USER: app
      MYSQL_PASSWORD: apppw
    # caching_sha2_password is the 8.0 default and is the interesting case for
    # the proxy: on an unencrypted client leg it takes the RSA public-key path,
    # which the proxy must relay without being able to read it.
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --max-connections=200
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-prootpw"]
      interval: 2s
      timeout: 5s
      retries: 30
