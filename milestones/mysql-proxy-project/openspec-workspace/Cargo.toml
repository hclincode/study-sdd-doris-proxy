[package]
name = "doris-row-filter-proxy"
version = "0.1.0"
edition = "2021"
description = "L7 MySQL proxy for Apache Doris that enforces row-level filtering by authenticated user"
publish = false

[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
sqlparser = "0.62"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# Client-facing wire protocol only. The BACKEND connection phase is hand-rolled
# on a raw TcpStream — see docs/adr/0001. `mysql_async` was tried and removed:
# nothing used it, because relaying an auth response verbatim (D1) is precisely
# what a client library will not let you do, and the result-set relay is
# hand-rolled too.
opensrv-mysql = "0.7"

# `AsyncMysqlShim` is declared with `#[async_trait]`, so implementing it without
# this crate means hand-writing `Pin<Box<dyn Future + Send>>` per method. Added
# as a direct dependency to keep the authentication path readable — it is the
# code most in need of review.
async-trait = "0.1"

[dev-dependencies]
proptest = "1"

[profile.test]
opt-level = 1
